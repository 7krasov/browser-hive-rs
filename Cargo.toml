[package]
name = "browser-hive"
version.workspace = true
edition.workspace = true
authors = ["Browser Hive Contributors"]
description = "Distributed web scraping system with browser automation and proxy management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7krasov/browser-hive-rs"
keywords = ["scraping", "browser", "automation", "proxy", "distributed"]
categories = ["web-programming", "network-programming"]

[lib]
name = "browser_hive"
path = "src/lib.rs"

[workspace]
members = [
    "crates/coordinator",
    "crates/worker",
    "crates/proto",
    "crates/common",
    "crates/tokio-cancellation-ext",
]
resolver = "2"

[workspace.package]
version = "0.24.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
url = "2.5"
# Public Suffix List (compiled-in) for registrable-domain (eTLD+1) comparison
psl = "2"

# Kubernetes
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# Browser automation
headless_chrome = "1.0"
# Second CDP client for browser-level methods headless_chrome does not expose
# (see worker/src/browser_cdp.rs). The browser endpoint is plain ws:// on loopback,
# so no TLS backend is needed. Kept on the same version headless_chrome resolves,
# so the two clients sharing one browser also share one WebSocket implementation
# instead of linking two copies of it.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

# Metrics
prometheus = "0.13"

# HTTP server for metrics
axum = "0.7"


# Root crate dependencies (facade pattern)
[dependencies]
browser-hive-common = { path = "crates/common" }
browser-hive-worker = { path = "crates/worker" }
browser-hive-proto = { path = "crates/proto" }

[features]
default = ["worker", "coordinator"]
# Enable only worker functionality
worker = []
# Enable only coordinator functionality
coordinator = []
